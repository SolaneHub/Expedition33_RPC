[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expedition33-discord-rpc"
version = "v1.4.0"
description = "Discord Rich Presence for Clair Obscur: Expedition 33"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Veronica" }
]
keywords = ["discord", "rich-presence", "expedition33", "gaming", "rpc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pypresence>=4.6.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
]

[project.scripts]
expedition33-rpc = "expedition33_rpc.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expedition33_rpc"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # Line length (handled by formatter)
    "B008", # Do not perform function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["expedition33_rpc"]

[tool.pyright]
include = ["src", "main.py", "build_exe.py"]
extraPaths = ["src"]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    ".venv",
]
pythonVersion = "3.10"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

