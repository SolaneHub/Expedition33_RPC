name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. vX.Y.Z)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify Code Quality & Tests (Ruff, Pyright, Pytest, Prettier)
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pyright
          uv run pytest
          npx prettier --check src/expedition33_rpc/assets/game_data.json

      - name: Build Standalone Executable
        run: uv run python build_exe.py

      - name: Run Smoke Test on Executable
        run: dist/Expedition33_RPC.exe --smoke-test

      - name: Generate SHA-256 Checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          files_to_hash = [
              Path("dist/Expedition33_RPC.exe"),
              Path("src/expedition33_rpc/assets/bridge.zip"),
          ]

          lines = []
          for p in files_to_hash:
              if p.exists():
                  with open(p, "rb") as f:
                      h = hashlib.file_digest(f, "sha256").hexdigest()
                  lines.append(f"{h}  {p.name}")
                  print(f"{h}  {p.name}")

          with open("dist/SHA256SUMS.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: "dist/Expedition33_RPC.exe"

      - name: Scan with VirusTotal (Optimized)
        id: virustotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          uv run python .github/scripts/virustotal_scan.py dist/Expedition33_RPC.exe src/expedition33_rpc/assets/bridge.zip --timeout 0

      - name: Extract Changelog Section
        id: extract_changelog
        shell: python
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          input_tag = os.environ.get("INPUT_TAG_NAME", "").strip()
          ref_name = os.environ.get("REF_NAME", "").strip()
          ref_type = os.environ.get("REF_TYPE", "").strip()
          candidate = input_tag if input_tag else (ref_name if ref_type == "tag" else "")

          tag = candidate
          if not tag:
              # Dynamically resolve version from pyproject.toml
              pyproject_path = Path("pyproject.toml")
              if pyproject_path.exists():
                  try:
                      with open(pyproject_path, "r", encoding="utf-8") as f:
                          for line in f:
                              line_clean = line.strip()
                              if line_clean.startswith("version =") or line_clean.startswith("version="):
                                  ver = line_clean.split("=", 1)[1].strip().strip('"').strip("'")
                                  if ver:
                                      tag = f"v{ver}" if not ver.startswith("v") else ver
                                      break
                  except Exception as e:
                      print(f"[Warning] Failed reading pyproject.toml: {e}")

              # Secondary fallback: src/expedition33_rpc/__init__.py
              if not tag:
                  init_path = Path("src/expedition33_rpc/__init__.py")
                  if init_path.exists():
                      try:
                          with open(init_path, "r", encoding="utf-8") as f:
                              for line in f:
                                  line_clean = line.strip()
                                  if line_clean.startswith("__version__"):
                                      ver = line_clean.split("=", 1)[1].strip().strip('"').strip("'")
                                      if ver:
                                          tag = f"v{ver}" if not ver.startswith("v") else ver
                                          break
                      except Exception as e:
                          print(f"[Warning] Failed reading src/expedition33_rpc/__init__.py: {e}")

          if not tag:
              sys.exit(
                  "Error: Unable to resolve release version. Neither input tag/ref, pyproject.toml, "
                  "nor src/expedition33_rpc/__init__.py provided a valid version string."
              )

          clean_num = tag.lstrip("v")

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              pattern = rf"## \[{re.escape(clean_num)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
          if not match:
              match = re.search(r"## \[[^\]]+\][^\n]*\n(.*?)(?=\n## \[|\Z)", content, re.DOTALL)

          release_notes = match.group(1).strip() if match else content

          # Append verification and security section
          sec_lines = ["\n\n## Verification & Security\n\n"]
          if os.path.exists("dist/SHA256SUMS.txt"):
              with open("dist/SHA256SUMS.txt", "r", encoding="utf-8") as sf:
                  checksums = sf.read().strip()
              sec_lines.append(f"### SHA-256 Checksums\n```text\n{checksums}\n```\n\n")

          vt_analysis = os.environ.get("VT_ANALYSIS", "").strip()
          if vt_analysis:
              sec_lines.append("### VirusTotal Analysis Reports\n")
              for item in vt_analysis.split(","):
                  item = item.strip()
                  if "=" in item:
                      fname, url = item.split("=", 1)
                      clean_fname = os.path.basename(fname.strip())
                      ratio = ""
                      if "|" in url:
                          url, ratio = url.split("|", 1)
                      link_text = f"VirusTotal Report ({ratio})" if ratio else "VirusTotal Report"
                      sec_lines.append(f"- **{clean_fname}**: [{link_text}]({url.strip()})\n")

          release_notes += "".join(sec_lines)

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as out:
              out.write(release_notes)

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write(f"version={tag}\n")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Expedition33_RPC.exe
            dist/SHA256SUMS.txt
            dist/virustotal_report.json
            src/expedition33_rpc/assets/bridge.zip
          body_path: RELEASE_NOTES.md
          tag_name: ${{ steps.extract_changelog.outputs.version }}
          name: ${{ steps.extract_changelog.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
