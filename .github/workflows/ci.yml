name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  test:
    name: Test & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint Check (Ruff)
        run: uv run ruff check

      - name: Format Check (Ruff)
        run: uv run ruff format --check

      - name: Format Check (Prettier - game_data.json)
        run: npx prettier --check src/expedition33_rpc/assets/game_data.json

      - name: Type Check (Pyright - Windows)
        run: uv run pyright --pythonplatform Windows

      - name: Type Check (Pyright - Linux)
        run: uv run pyright --pythonplatform Linux

      - name: Verify Bridge Zip
        run: uv run python tools/build_bridge_zip.py --check

      - name: Tier 1 - Fast Unit Tests
        run: uv run pytest -m unit
        env:
          PYSTRAY_BACKEND: dummy

      - name: Tier 2 - Integration Tests
        run: uv run pytest -m integration
        env:
          PYSTRAY_BACKEND: dummy

      - name: Tier 3 - CI Tests
        run: uv run pytest -m ci
        env:
          PYSTRAY_BACKEND: dummy

      - name: Build Standalone Executable
        if: matrix.os == 'windows-latest'
        run: uv run python build_exe.py

      - name: Verify Executable Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Expedition33_RPC.exe")) {
            Write-Error "dist/Expedition33_RPC.exe was not created by build_exe.py"
            exit 1
          }
          $size = (Get-Item "dist/Expedition33_RPC.exe").Length
          if ($size -le 0) {
            Write-Error "dist/Expedition33_RPC.exe is an empty file"
            exit 1
          }
          Write-Host "Verified build artifact: dist/Expedition33_RPC.exe ($size bytes)"
          $proc = Start-Process -FilePath "dist/Expedition33_RPC.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "Smoke test failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

  soak:
    name: Soak & Chaos Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Soak Matrix
        run: uv run python tools/run_matrix.py --tier soak
