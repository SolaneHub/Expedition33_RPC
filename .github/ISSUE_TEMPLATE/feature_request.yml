name: Feature Request
description: Suggest an idea or enhancement for Expedition33_RPC
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the Rich Presence experience, map more zones/flags, or add new integration features? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or limitation?
      description: A clear and concise description of the limitation or use case.
      placeholder: I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution or feature
      description: A clear and concise description of what you want to happen.
      placeholder: It would be awesome if the presence displayed...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
